<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5"/>
  <line x1="40" y1="260" x2="560" y2="260" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="300" cy="180" r="140" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,6"/>

  <rect x="24" y="20" width="552" height="48" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
  <text x="40" y="49" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Knees-Chest-Chin (Ashtanga Namaskara)</text>
  
  <rect x="420" y="30" width="70" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="455" y="47" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Yoga</text>
  
  <rect x="498" y="30" width="68" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="532" y="47" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Low</text>

  <!-- Left: Starting Position -->
  <g transform="translate(40, 85)">
    <rect width="210" height="185" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <rect x="12" y="12" width="100" height="22" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="20" y="27" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">1. START POSITION</text>

    <g transform="translate(105, 115)">
      <circle cx="0" cy="-60" r="12" fill="#64748b" opacity="0.9"/>
      <line x1="0" y1="-48" x2="0" y2="0" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
      <path d="M 0 -42 L -18 -15 L -20 10" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
      <path d="M 0 -42 L 18 -15 L 20 10" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
      <path d="M 0 0 L -14 30 L -14 65" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
      <path d="M 0 0 L 14 30 L 14 65" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="0" cy="70" rx="28" ry="5" fill="#0f172a" opacity="0.6"/>
    </g>
    <text x="105" y="172" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#cbd5e1" font-weight="500">Neutral setup stance</text>
  </g>

  <!-- Flow Arrow -->
  <g transform="translate(262, 160)">
    <circle cx="20" cy="20" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M 12 20 L 26 20 M 20 14 L 27 20 L 20 26" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="55" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">FLOW</text>
  </g>

  <!-- Right: Main Movement / Pose -->
  <g transform="translate(320, 85)">
    <rect width="240" height="185" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="12" y="12" width="135" height="22" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <text x="20" y="27" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">2. MAIN MOVEMENT / POSE</text>

    <g transform="translate(120, 115)">
      <circle cx="0" cy="-60" r="13" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="4" cy="-62" r="2" fill="#38bdf8"/>
      <line x1="0" y1="-47" x2="0" y2="0" stroke="#f8fafc" stroke-width="9" stroke-linecap="round"/>
      <line x1="0" y1="-47" x2="0" y2="0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,3"/>
      <path d="M 0 -40 L -25 -20 L -35 -45" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-35" cy="-45" r="4" fill="#38bdf8"/>
      <path d="M 0 -40 L 25 -20 L 35 -45" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="35" cy="-45" r="4" fill="#38bdf8"/>
      <path d="M 0 0 L -18 32 L -20 65" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-18" cy="32" r="4" fill="#38bdf8"/>
      <path d="M 0 0 L 20 28 L 22 65" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="28" r="4" fill="#38bdf8"/>
      <ellipse cx="0" cy="70" rx="35" ry="6" fill="#38bdf8" opacity="0.3" filter="url(#glow)"/>
    </g>
    <text x="120" y="172" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#38bdf8" font-weight="600">Active Peak Alignment</text>
  </g>

  <!-- Bottom Guidance -->
  <g transform="translate(24, 285)">
    <rect width="552" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="28" cy="26" r="12" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <text x="28" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">✓</text>
    <text x="50" y="23" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">START:</text>
    <text x="96" y="23" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Plank position, core engaged</text>
    <text x="50" y="42" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">ACTION:</text>
    <text x="105" y="42" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">Lower knees, then chest and chin to floor, elbows hugged in</text>
    <text x="50" y="61" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#f59e0b">KEY CUE:</text>
    <text x="110" y="61" font-family="Inter, sans-serif" font-size="11" fill="#e2e8f0">Keep hips elevated slightly, glide forward into Cobra</text>
  </g>
</svg>